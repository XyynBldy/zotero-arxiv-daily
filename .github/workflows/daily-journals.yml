name: Daily journals - new articles

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成报告，不发送邮件也不更新去重状态"
        required: false
        default: true
        type: boolean
  schedule:
    # 每天北京时间 08:37（UTC 00:37），避开整点高峰
    - cron: '37 0 * * *'

permissions:
  contents: write   # 只用于提交已推送文章的 DOI / 标题哈希去重状态

concurrency:
  group: daily-journals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  journal-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SENDER: ${{ secrets.SENDER }}
      RECEIVER: ${{ secrets.RECEIVER }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      SMTP_SERVER: ${{ vars.SMTP_SERVER }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies
        run: python -m pip install 'requests>=2.31,<3' 'PyYAML>=6,<7'

      - name: Fetch, deduplicate, and optionally email new articles
        run: python scripts/journal_digest.py --config config/journal_digest.yaml --state state/journals-seen.json --report-dir reports/journals

      - name: Upload a copy of the daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-digest-${{ github.run_id }}
          path: reports/journals/
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist delivered-paper state
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: |
          if git diff --quiet -- state/journals-seen.json && [ -z "$(git ls-files --others --exclude-standard state/journals-seen.json)" ]; then
            echo 'No state changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/journals-seen.json
          git commit -m 'chore: update delivered journal articles [skip ci]'
          git push
